# ==============================================================================
# Database Configuration: Multi-DataSource Architecture
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Primary DataSource: Library Management System (Catalog, Inventory, Loans)
# ------------------------------------------------------------------------------
library.db.type=postgresql
library.db.jdbcUrl=jdbc:postgresql://localhost:5432/library_db
library.db.driverClassName=org.postgresql.Driver
library.db.username=library_user
library.db.password=library_password_secure
library.db.maximumPoolSize=15
library.db.minimumIdle=5
library.db.idleTimeout=300000
library.db.connectionTimeout=20000
library.db.poolName=HikariPool-LibraryDB

# ------------------------------------------------------------------------------
# 2. Secondary DataSource: User Management & Authentication Module (Isolated DB)
# ------------------------------------------------------------------------------
userauth.db.type=postgresql
userauth.db.jdbcUrl=jdbc:postgresql://localhost:5432/user_auth_db
userauth.db.driverClassName=org.postgresql.Driver
userauth.db.username=userauth_user
userauth.db.password=userauth_password_secure
userauth.db.maximumPoolSize=10
userauth.db.minimumIdle=3
userauth.db.idleTimeout=300000
userauth.db.connectionTimeout=20000
userauth.db.poolName=HikariPool-UserAuthDB
